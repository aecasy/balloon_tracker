x-ros-node-build: &ros_node_build
  build:
    context: .
    dockerfile: Dockerfile.ros
  image: ${DOCKER_IMAGE:-casy-ros-node}

services:
  simulink-ros-device:
    build:
      context: .
      dockerfile: Dockerfile.simulink-ros-device
    image: ${SIMULINK_ROS_DEVICE_IMAGE:-casy-simulink-ros-device}
    network_mode: "host"
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI:-http://192.168.1.154:11311}
      ROS_IP: ${ROS_IP:-192.168.1.168}
      SIMULINK_ROS_DEVICE_SSH_PORT: ${SIMULINK_ROS_DEVICE_SSH_PORT:-2222}
      SIMULINK_ROS_DEVICE_PASSWORD_FILE: /run/secrets/simulink_ros_device_password
      SIMULINK_CATKIN_WORKSPACE: /home/ubuntu/catkin_ws
    volumes:
      - ${SIMULINK_CATKIN_HOST_DIR:-/home/casy/simulink_catkin_ws}:/home/ubuntu/catkin_ws
      - ${SIMULINK_ROS_DEVICE_PASSWORD_FILE:-/etc/casy-drone/simulink_ros_device_password}:/run/secrets/simulink_ros_device_password:ro
    profiles: ["simulink"]

  target-bearing:
    <<: *ros_node_build
    network_mode: "host"
    environment: &ros_env
      ROS_MASTER_URI: ${ROS_MASTER_URI:-http://192.168.1.154:11311}
      ROS_IP: ${ROS_IP:-192.168.1.168}
      RC_OVERRIDE_TOPIC: ${RC_OVERRIDE_TOPIC:-quad_commands}
      AUTONOMY_ENABLE_TOPIC: ${AUTONOMY_ENABLE_TOPIC:-autonomy_enable}
      RC_CH7_HIGH_THRESH: ${RC_CH7_HIGH_THRESH:-1800}
      LATENCY_DIAGNOSTICS: ${LATENCY_DIAGNOSTICS:-0}
      TARGET_LATENCY_TOPIC: ${TARGET_LATENCY_TOPIC:-/target_latency}
      PYTHONUNBUFFERED: "1"
    command: python3 /app/src/ros_nodes/target_bearing_node.py
    stdin_open: true
    tty: false
    profiles: ["pipeline"]

  rc-override:
    <<: *ros_node_build
    network_mode: "host"
    environment:
      <<: *ros_env
      MAVLINK_RC_OVERRIDE_ENDPOINT: ${MAVLINK_RC_OVERRIDE_ENDPOINT:-udp:127.0.0.1:14552}
    command: python3 /app/src/ros_nodes/ros_rc_bridge.py
    restart: unless-stopped

  rc-ch7:
    <<: *ros_node_build
    network_mode: "host"
    environment:
      <<: *ros_env
      MAVLINK_RC_CH7_ENDPOINT: ${MAVLINK_RC_CH7_ENDPOINT:-udp:127.0.0.1:14551}
    command: python3 /app/src/ros_nodes/ros_rc_ch7_read.py
    restart: unless-stopped

  roscore:
    image: ros:noetic-ros-core-focal
    network_mode: "host"
    command: roscore
    restart: unless-stopped
    profiles: ["bench"]
